name: Build Android APK
on:
  push:
    branches: [main]
    paths-ignore: ["books/**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: App icons from the official logo (assets/icon-only.png)
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0A4C98' --iconBackgroundColorDark '#0A4C98' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#FFFFFF'
      - name: Notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' $M
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk hozaty.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hozaty-debug-apk
          path: hozaty.apk
